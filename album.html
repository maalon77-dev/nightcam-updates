<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>NightCam Album</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0B1220; color: #F1F5F9; }
    header { padding: 20px 16px 8px; text-align: center; }
    h1 { margin: 0; color: #2EE6A6; font-size: 22px; letter-spacing: .08em; }
    .sub, .count, .err { color: #94A3B8; font-size: 13px; margin-top: 6px; }
    .count { color: #4CC9F0; }
    .err { color: #FB7185; padding: 24px; text-align: center; }
    .wrap { padding: 12px 14px 40px; max-width: 720px; margin: 0 auto; }
    .card { background: #121A2B; border: 1px solid #334155; border-radius: 16px; padding: 14px; margin: 14px 0; }
    .meta { color: #64748B; font-size: 12px; }
    h2 { font-size: 15px; margin: 6px 0 10px; word-break: break-all; }
    video { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; }
    .btn { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 12px;
           background: #2EE6A6; color: #042F2E; font-weight: 700; text-decoration: none; }
    .empty { text-align: center; color: #94A3B8; padding: 40px 10px; }
    .loading { text-align: center; padding: 40px; color: #94A3B8; }
  </style>
</head>
<body>
  <header>
    <h1>NIGHTCAM</h1>
    <div class="sub" id="subtitle">Carregando álbum…</div>
    <div class="count" id="count"></div>
  </header>
  <div class="wrap" id="wrap">
    <div class="loading">Abrindo galeria…</div>
  </div>
  <script>
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmt(ts) {
      try {
        return new Date(ts).toLocaleString('pt-BR');
      } catch (e) { return ''; }
    }
    async function main() {
      const params = new URLSearchParams(location.search);
      let src = params.get('src') || params.get('json');
      const wrap = document.getElementById('wrap');
      const subtitle = document.getElementById('subtitle');
      const count = document.getElementById('count');
      if (!src) {
        wrap.innerHTML = '<div class="err">Álbum inválido. Escaneie o QR de novo no NightCam.</div>';
        return;
      }
      try {
        src = decodeURIComponent(src);
      } catch (e) {}
      try {
        const res = await fetch(src, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const deviceId = data.deviceId || '—';
        const videos = (data.videos || []).slice().sort(function(a,b){ return (b.uploadedAt||0)-(a.uploadedAt||0); });
        subtitle.textContent = 'Álbum do aparelho · ' + deviceId;
        count.textContent = videos.length + ' vídeo(s) · do mais novo ao mais antigo';
        if (!videos.length) {
          wrap.innerHTML = '<p class="empty">Nenhum vídeo neste álbum ainda.</p>';
          return;
        }
        wrap.innerHTML = videos.map(function(v){
          const name = esc(v.name || 'video');
          const url = esc(v.url || '');
          const when = esc(fmt(v.uploadedAt));
          return '<article class="card">' +
            '<div class="meta">' + when + '</div>' +
            '<h2>' + name + '</h2>' +
            '<video src="' + url + '" controls playsinline preload="metadata"></video>' +
            '<a class="btn" href="' + url + '" target="_blank" rel="noopener">Abrir vídeo</a>' +
            '</article>';
        }).join('');
      } catch (e) {
        wrap.innerHTML = '<div class="err">Não foi possível abrir o álbum.<br>' + esc(e.message) + '</div>';
      }
    }
    main();
  </script>
</body>
</html>
