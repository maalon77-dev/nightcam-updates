<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>NightCam · Vídeo</title>
  <script src="nightcam-download.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0B1220; color: #F1F5F9; }
    header { padding: 20px 16px 8px; text-align: center; }
    h1 { margin: 0; color: #2EE6A6; font-size: 22px; letter-spacing: .08em; }
    .sub, .err, .hint { color: #94A3B8; font-size: 13px; margin-top: 8px; }
    .hint { font-size: 12px; max-width: 420px; margin-left: auto; margin-right: auto; line-height: 1.45; }
    .err { color: #FB7185; padding: 24px; text-align: center; }
    .wrap { padding: 12px 14px 40px; max-width: 720px; margin: 0 auto; }
    .card { background: #121A2B; border: 1px solid #334155; border-radius: 16px; padding: 14px; margin: 14px 0; }
    h2 { font-size: 15px; margin: 0 0 10px; word-break: break-all; }
    video { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .actions a, .actions button {
      width: 100%; text-align: center; padding: 16px 12px; border-radius: 12px;
      font-weight: 700; font-size: 16px; text-decoration: none; border: 0; cursor: pointer;
      font-family: inherit; display: block;
    }
    .btn-dl { background: #2EE6A6; color: #042F2E; font-size: 18px; padding: 18px 14px; }
    .btn-dl-sub { background: #0C4A6E; color: #E0F2FE; font-size: 14px; padding: 12px; }
    .status { font-size: 13px; color: #4CC9F0; text-align: center; min-height: 1.2em; margin-top: 8px; line-height: 1.4; }
    .progress { height: 4px; background: #1e293b; border-radius: 4px; margin-top: 8px; overflow: hidden; display: none; }
    .progress i { display: block; height: 100%; width: 0; background: #2EE6A6; transition: width .2s; }
  </style>
</head>
<body>
  <header>
    <h1>NIGHTCAM</h1>
    <div class="sub" id="subtitle">Vídeo compartilhado</div>
    <div class="hint" id="headerHint">Toque em <strong>Baixar vídeo</strong> — funciona no celular e no computador.</div>
  </header>
  <div class="wrap" id="wrap">
    <p class="err">Carregando…</p>
  </div>
  <script>
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fileNameFromUrl(url, name) {
      if (name) {
        var n = String(name).replace(/[^\w.\-]+/g, '_');
        if (!/\.(mp4|webm|3gp|mkv)$/i.test(n)) n += '.mp4';
        return n;
      }
      try {
        var path = new URL(url).pathname;
        var base = path.split('/').pop() || 'nightcam_video.mp4';
        if (!/\.(mp4|webm|3gp|mkv)$/i.test(base)) base += '.mp4';
        return base;
      } catch (e) { return 'nightcam_video.mp4'; }
    }
    function main() {
      var params = new URLSearchParams(location.search);
      var videoUrl = params.get('v') || params.get('url') || params.get('src');
      var name = params.get('n') || params.get('name') || '';
      var wrap = document.getElementById('wrap');
      if (!videoUrl) {
        wrap.innerHTML = '<div class="err">Link inválido. Escaneie o QR de novo no NightCam.</div>';
        return;
      }
      if (/%2F|%3A/i.test(videoUrl)) {
        try { videoUrl = decodeURIComponent(videoUrl); } catch (e) {}
      }
      if (name && /%[0-9A-F]/i.test(name)) {
        try { name = decodeURIComponent(name); } catch (e) {}
      }
      if (!/^https?:\/\//i.test(videoUrl)) {
        wrap.innerHTML = '<div class="err">URL do vídeo inválida.</div>';
        return;
      }
      var fname = fileNameFromUrl(videoUrl, name);
      var title = name || fname;
      document.getElementById('subtitle').textContent = title;
      var hint = document.getElementById('headerHint');
      if (window.NightCamDownload && NightCamDownload.isIOS()) {
        hint.innerHTML = 'Toque <strong>Baixar vídeo</strong>. No iPhone, use também “Salvar em Arquivos” se aparecer.';
      } else if (NightCamDownload.isAndroid()) {
        hint.innerHTML = 'Toque <strong>Baixar vídeo</strong> — o Chrome salva em Downloads.';
      } else {
        hint.innerHTML = 'Clique em <strong>Baixar vídeo</strong> — o arquivo vai para Downloads (ou use o link MP4).';
      }
      wrap.innerHTML =
        '<article class="card">' +
          '<h2>' + esc(title) + '</h2>' +
          '<video src="' + esc(videoUrl) + '" controls playsinline preload="metadata"></video>' +
          '<div class="progress" id="prog"><i id="progBar"></i></div>' +
          '<div class="status" id="status"></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn-dl" id="btnDl" aria-label="Baixar vídeo">Baixar vídeo</button>' +
            '<a class="btn-dl-sub" id="lnkMp4" href="' + esc(videoUrl) + '" download="' + esc(fname) + '" target="_blank" rel="noopener noreferrer">Abrir arquivo MP4 (computador / plano B)</a>' +
          '</div>' +
        '</article>';
      var btn = document.getElementById('btnDl');
      var status = document.getElementById('status');
      var prog = document.getElementById('prog');
      var progBar = document.getElementById('progBar');
      btn.addEventListener('click', function () {
        btn.disabled = true;
        btn.textContent = 'Baixando…';
        prog.style.display = 'block';
        NightCamDownload.downloadVideo(videoUrl, fname, {
          onStatus: function (msg) { status.textContent = msg; },
          onProgress: function (pct) { progBar.style.width = pct + '%'; },
          onDone: function () {
            btn.disabled = false;
            btn.textContent = 'Baixar vídeo';
          }
        });
      });
    }
    main();
  </script>
</body>
</html>
